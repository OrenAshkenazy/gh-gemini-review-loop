name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint (ruff)
        run: ruff check plugins/ tests/
      - name: Compile scripts
        run: python -m py_compile plugins/gh-gemini-review-loop/skills/gh-gemini-review-loop/scripts/*.py
      - name: Validate plugin packaging
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("plugins/gh-gemini-review-loop")
          claude = json.loads((root / ".claude-plugin/plugin.json").read_text())
          codex = json.loads((root / ".codex-plugin/plugin.json").read_text())
          marketplace = json.loads(Path(".agents/plugins/marketplace.json").read_text())
          hooks = json.loads((root / "hooks/hooks.json").read_text())

          assert claude["name"] == codex["name"] == "gh-gemini-review-loop"
          assert claude["version"] == codex["version"]
          assert codex["skills"] == "./skills/"
          assert (root / "skills/gh-gemini-review-loop/SKILL.md").exists()
          assert (root / "hooks/hooks.json").exists()
          assert "hooks" in hooks and "PreToolUse" in hooks["hooks"] and "Stop" in hooks["hooks"]
          assert marketplace["plugins"][0]["name"] == "gh-gemini-review-loop"
          assert marketplace["plugins"][0]["source"] == {
              "source": "local",
              "path": "./plugins/gh-gemini-review-loop",
          }
          PY
      - name: Pytest
        run: pytest tests/ -v
