name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint (ruff)
        run: ruff check plugins/ tests/
      - name: Compile
        run: python -m py_compile plugins/gh-gemini-review-loop/skills/gh-gemini-review-loop/scripts/fetch_gemini_threads.py
      - name: Pytest
        run: pytest tests/ -v
