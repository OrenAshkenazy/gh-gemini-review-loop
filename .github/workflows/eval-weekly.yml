name: Weekly finding-quality eval

# Layer B eval: runs the LLM-as-judge over evals/fixtures/ once a week,
# commits the rendered summary to evals/results/ for end-user visibility,
# and (optionally) updates a rolling per-quarter tracking Issue.
#
# Outputs:
#   - evals/results/latest.md            <- always overwritten; the README links here
#   - evals/results/YYYY-QQ.md           <- per-quarter append-only history
#   - A comment on the per-quarter tracking Issue (for maintainer notifications)
#
# Fails the run if judge↔human agreement drops below the calibration gate (80%).
# Catches: drift in Gemini's output format, regressions in the judge model,
# and degradation of the calibration set over time.

on:
  schedule:
    # Sundays at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:  # also run on demand from the Actions tab

permissions:
  contents: write   # we commit eval results back to main
  issues: write

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Override the default judge by setting an OPENAI_JUDGE_MODEL repo variable
      # (e.g. "gpt-4o" for higher quality at ~20x cost). Empty falls back to
      # judge.py's DEFAULT_MODEL.
      OPENAI_JUDGE_MODEL: ${{ vars.OPENAI_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT so we can push the rendered report back to main past the
          # branch-protection ruleset. Same secret the release workflow uses.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --upgrade pip openai

      - name: Run eval
        id: eval
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning ::OPENAI_API_KEY secret not set; skipping run."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/eval
          # 3 samples per finding for variance measurement.
          python -m evals.run_eval \
              --samples 3 \
              --report /tmp/eval/report.json \
              --exit-nonzero-on-disagreement \
              | tee /tmp/eval/summary.md
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Commit rendered report to evals/results/
        if: steps.eval.outputs.skipped != 'true' && (success() || failure())
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p evals/results
          QUARTER=$(date -u +"%Y-Q$((($(date -u +%m)-1)/3 + 1))")
          STAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          STATUS_BADGE="✅"
          if [ "${{ job.status }}" = "failure" ]; then STATUS_BADGE="❌ (agreement gate failed)"; fi

          # Build the rendered report once, then write it to both the
          # rolling "latest" pointer and the per-quarter history file.
          {
            echo "# Layer B finding-quality eval — ${STAMP}"
            echo ""
            echo "Status: ${STATUS_BADGE}"
            echo "[Workflow run](${RUN_URL})"
            echo ""
            cat /tmp/eval/summary.md
            echo ""
            echo "<details><summary>Raw JSON report</summary>"
            echo ""
            echo '```json'
            cat /tmp/eval/report.json
            echo '```'
            echo ""
            echo "</details>"
          } > /tmp/eval/rendered.md

          cp /tmp/eval/rendered.md evals/results/latest.md
          # Append to the per-quarter file so we keep a rolling history.
          {
            echo ""
            echo "---"
            echo ""
            cat /tmp/eval/rendered.md
          } >> "evals/results/${QUARTER}.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/results/
          if git diff --cached --quiet; then
            echo "No eval-results changes to commit."
          else
            git commit -m "chore(eval): update evals/results — ${STAMP} [skip ci]"
            git push origin main
          fi

      - name: Update tracking issue
        if: steps.eval.outputs.skipped != 'true' && (success() || failure())
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          QUARTER=$(date -u +"%Y-Q$((($(date -u +%m)-1)/3 + 1))")
          TITLE="eval(weekly): finding-quality report — ${QUARTER}"
          STATUS_BADGE="✅"
          if [ "${{ job.status }}" = "failure" ]; then STATUS_BADGE="❌"; fi
          {
            echo "## ${STATUS_BADGE} Eval run — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "Rendered report committed to [evals/results/latest.md](${{ github.server_url }}/${{ github.repository }}/blob/main/evals/results/latest.md)."
            echo "[Workflow run](${RUN_URL})"
            echo ""
            cat /tmp/eval/summary.md
          } > /tmp/eval/comment.md
          existing=$(gh issue list --search "${TITLE}" --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file /tmp/eval/comment.md
          else
            gh issue create --title "${TITLE}" --body-file /tmp/eval/comment.md --label eval || \
              gh issue create --title "${TITLE}" --body-file /tmp/eval/comment.md
          fi
