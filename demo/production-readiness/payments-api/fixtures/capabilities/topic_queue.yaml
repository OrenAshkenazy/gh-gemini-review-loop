capability: topic_queue
inputs:
  topic: required
  service: required
generates:
  - kafka_topic
checks:
  - helm_template
  - policy
  - naming_convention
approval:
  required_from:
    - data-platform
template_map:
  kafka_topic:
    template: templates/kafka_topic.tmpl
    output: envs/prod/payments-api/topics/${topic}.yaml
